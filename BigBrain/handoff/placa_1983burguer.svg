<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <clipPath id="card-shape">
      <rect x="0" y="0" width="1000" height="1000" rx="60" ry="60"/>
    </clipPath>
    <linearGradient id="topGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4DA2AD"/>
      <stop offset="1" stop-color="#276B75"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#card-shape)">
    <!-- Base Areia Nobre / Fundo Base -->
    <rect width="1000" height="1000" rx="60" ry="60" fill="#FAF8F5"/>

    <!-- Topo Institucional com Curva Canônica -->
    <path d="M0,0 H1000 V530 Q500,480 0,530 Z" fill="url(#topGrad)"/>

    <!-- ZONA A: MARCA E IDENTIDADE -->
    <g transform="translate(90, 110)">
      <image x="0" y="0" width="140" height="140" preserveAspectRatio="xMidYMid meet" href="data:image/png;base64,"/>
      <g transform="translate(160, 42)">
        <text font-family="'Cinzel', 'Georgia', serif" font-size="38" font-weight="700" fill="#FAF8F5" letter-spacing="2">1983 BURGUER</text>
        <text font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#FAF8F5" letter-spacing="3" opacity="0.85" y="40">FLORIANÓPOLIS • BRASIL</text>
      </g>
    </g>

    <!-- ZONA B: SENSOR NFC CANÔNICO (X: 700 a 910) -->
    <g fill="none" stroke="#E8A825" stroke-width="14" stroke-linecap="round">
      <circle cx="720" cy="180" r="14" fill="#E8A825" stroke="none"/>
      <path d="M 760 125 Q 830 180 760 235"/>
      <path d="M 800 95 Q 880 180 800 265"/>
      <path d="M 840 65 Q 930 180 840 295"/>
    </g>

    <!-- Pílula NFC -->
    <rect x="710" y="300" width="180" height="46" rx="23" fill="#E8A825"/>
    <text x="800" y="333" font-family="'Plus Jakarta Sans', Helvetica, sans-serif" font-size="30" font-weight="800" fill="#12181A" text-anchor="middle" letter-spacing="3">NFC</text>
    <text x="800" y="378" font-family="'Plus Jakarta Sans', Helvetica, sans-serif" font-size="28" font-weight="500" fill="#FAF8F5" text-anchor="middle">Aproxime o celular</text>

    <!-- ZONA C: CHAMADA 'UM TOQUE LIBERA' -->
    <text x="90" y="615" font-family="'Plus Jakarta Sans', Helvetica, sans-serif" font-size="29" font-weight="800" fill="#276B75" letter-spacing="4">UM TOQUE LIBERA</text>

    <!-- ZONA D: GRADE 2x2 DE ATIVAÇÃO DE EXPERIÊNCIA -->
    <g>
      <circle cx="130" cy="710" r="40" fill="#276B75" fill-opacity="0.12"/>
      <text x="190" y="724" font-family="'Plus Jakarta Sans', Helvetica, sans-serif" font-size="44" font-weight="600" fill="#12181A">Avaliações Google</text>
    </g>
    <g>
      <circle cx="580" cy="710" r="40" fill="#276B75" fill-opacity="0.12"/>
      <text x="640" y="724" font-family="'Plus Jakarta Sans', Helvetica, sans-serif" font-size="44" font-weight="600" fill="#12181A">Cardápio &amp; Room</text>
    </g>
    <g>
      <circle cx="130" cy="850" r="40" fill="#276B75" fill-opacity="0.12"/>
      <text x="190" y="864" font-family="'Plus Jakarta Sans', Helvetica, sans-serif" font-size="44" font-weight="600" fill="#12181A">Wi-Fi &amp; Serviços</text>
    </g>
    <g>
      <circle cx="580" cy="850" r="40" fill="#276B75" fill-opacity="0.12"/>
      <text x="640" y="864" font-family="'Plus Jakarta Sans', Helvetica, sans-serif" font-size="44" font-weight="600" fill="#12181A">Recepção 24h</text>
    </g>
  </g>
</svg>