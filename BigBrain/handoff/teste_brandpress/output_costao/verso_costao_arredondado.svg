<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <clipPath id="cardClipVerso">
      <rect width="1000" height="1000" rx="60" ry="60"/>
    </clipPath>
    <linearGradient id="darkBgVerso" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141815"/>
      <stop offset="100%" stop-color="#080B09"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#cardClipVerso)">
    <!-- Fundo Escuro com Gradiente -->
    <rect width="1000" height="1000" fill="url(#darkBgVerso)"/>
    
    <!-- Moldura Interna Dourada Arredondada -->
    <rect x="50" y="50" width="900" height="900" rx="40" fill="#141B16" stroke="#F09C24" stroke-width="2.5"/>
    
    <!-- Cabeçalho de Avaliação -->
    <text x="500" y="160" font-family="'Plus Jakarta Sans', sans-serif" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">SUA OPINIÃO É FUNDAMENTAL</text>
    <text x="500" y="205" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="600" fill="#F09C24" text-anchor="middle" letter-spacing="2">AVALIE O COSTÃO NO GOOGLE</text>
    
    <!-- 5 Estrelas Douradas -->
    <g transform="translate(500, 265)">
      <text x="0" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-size="44" fill="#F09C24" text-anchor="middle" letter-spacing="8">★★★★★</text>
    </g>
    
    <!-- QR Code Central em Container Branco com Cantos Arredondados -->
    <g transform="translate(500, 500)">
      <rect x="-140" y="-140" width="280" height="280" rx="24" fill="#FFFFFF" filter="drop-shadow(0px 8px 16px rgba(0,0,0,0.3))"/>
      <!-- Padrão QR Code de Alta Fidelidade -->
      <rect x="-115" y="-115" width="70" height="70" fill="#080B09" rx="6"/>
      <rect x="-95" y="-95" width="30" height="30" fill="#FFFFFF" rx="2"/>
      <rect x="-85" y="-85" width="10" height="10" fill="#F09C24"/>
      
      <rect x="45" y="-115" width="70" height="70" fill="#080B09" rx="6"/>
      <rect x="65" y="-95" width="30" height="30" fill="#FFFFFF" rx="2"/>
      <rect x="75" y="-85" width="10" height="10" fill="#F09C24"/>
      
      <rect x="-115" y="45" width="70" height="70" fill="#080B09" rx="6"/>
      <rect x="-95" y="65" width="30" height="30" fill="#FFFFFF" rx="2"/>
      <rect x="-85" y="75" width="10" height="10" fill="#F09C24"/>
      
      <!-- Módulos centrais / Sensor NFC Icon -->
      <rect x="-24" y="-24" width="48" height="48" rx="8" fill="#F09C24"/>
      <circle cx="0" cy="0" r="12" fill="#080B09"/>
      <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
    </g>
    
    <!-- Instruções de Uso -->
    <text x="500" y="710" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="middle">Aproxime o celular ou aponte a câmera para o QR Code</text>
    <text x="500" y="745" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="500" fill="#9CA3AF" text-anchor="middle">Leva menos de 1 minuto e apoia nossa equipe</text>
    
    <!-- Rodapé Tecnológico com Filete -->
    <line x1="120" y1="800" x2="880" y2="800" stroke="#2B382F" stroke-width="1.5"/>
    <text x="500" y="855" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700" fill="#F09C24" text-anchor="middle" letter-spacing="2">AH3 SMART HOSPITALITY TECH</text>
  </g>
</svg>